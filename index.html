<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gears of Fate — RPG Character Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ─────────────────────────────────────────────────── */
:root {
  --brass:        #b87333;
  --brass-light:  #d4956a;
  --brass-dark:   #7a4a1e;
  --copper:       #cb6d51;
  --copper-light: #e8956d;
  --gold:         #c9a84c;
  --gold-light:   #e8c97a;
  --parchment:    #f5ead6;
  --parchment-dark: #e8d5b5;
  --parchment-deep: #d4b896;
  --ink:          #2a1f14;
  --ink-light:    #4a3728;
  --ink-faint:    #7a6555;
  --steel:        #4a5568;
  --rust:         #8b3a2a;
  --verdigris:    #4a7c6f;
  --shadow:       rgba(0,0,0,0.4);
  --glow-brass:   rgba(184,115,51,0.3);

  --font-display: 'Cinzel', serif;
  --font-body:    'Crimson Pro', serif;

  --radius:    4px;
  --radius-lg: 8px;
}

/* ── RESET & BASE ──────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.65;
  color: var(--ink);
  background-color: #1a1208;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── BACKGROUND TEXTURE ────────────────────────────────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(184,115,51,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 60% 60% at 80% 80%, rgba(74,60,40,0.3) 0%, transparent 60%),
    repeating-linear-gradient(
      45deg,
      transparent,
      transparent 2px,
      rgba(184,115,51,0.015) 2px,
      rgba(184,115,51,0.015) 4px
    );
  pointer-events: none;
  z-index: 0;
}

/* ── LAYOUT ────────────────────────────────────────────────────────── */
.page-wrap {
  position: relative;
  z-index: 1;
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem 1.5rem 6rem;
}

/* ── HEADER ────────────────────────────────────────────────────────── */
.site-header {
  text-align: center;
  padding: 3rem 0 2rem;
  position: relative;
}

.site-header::before,
.site-header::after {
  content: '⚙';
  font-size: 1.4rem;
  color: var(--brass);
  opacity: 0.5;
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
}
.site-header::before { left: 0; }
.site-header::after  { right: 0; }

.site-title {
  font-family: var(--font-display);
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--gold);
  text-shadow: 0 0 30px var(--glow-brass), 0 2px 4px rgba(0,0,0,0.6);
  line-height: 1.1;
}

.site-subtitle {
  font-family: var(--font-body);
  font-style: italic;
  color: var(--brass-light);
  font-size: 1rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: 0.4rem;
  opacity: 0.8;
}

.divider {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin: 1.5rem 0;
  color: var(--brass-dark);
  font-size: 0.9rem;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--brass-dark), transparent);
}

/* ── API KEY INPUT ─────────────────────────────────────────────────── */
.api-section {
  background: rgba(26,18,8,0.7);
  border: 1px solid var(--brass-dark);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.5rem;
  display: flex;
  gap: 0.75rem;
  align-items: center;
  flex-wrap: wrap;
}

.api-section label {
  font-family: var(--font-display);
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  color: var(--brass-light);
  white-space: nowrap;
}

.api-input {
  flex: 1;
  min-width: 200px;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--brass-dark);
  border-radius: var(--radius);
  color: var(--parchment);
  font-family: monospace;
  font-size: 0.85rem;
  padding: 0.5rem 0.75rem;
  outline: none;
  transition: border-color 0.2s;
}
.api-input:focus { border-color: var(--brass); }
.api-input::placeholder { color: var(--ink-faint); opacity: 0.6; }

/* ── GENERATE BUTTON ───────────────────────────────────────────────── */
.generate-wrap {
  text-align: center;
  margin: 1.5rem 0;
}

.btn-generate {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  background: linear-gradient(135deg, var(--brass-dark) 0%, var(--brass) 50%, var(--gold) 100%);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 0.9rem 2.5rem;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 20px rgba(184,115,51,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
}
.btn-generate::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 60%);
  pointer-events: none;
}
.btn-generate:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(184,115,51,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
}
.btn-generate:active:not(:disabled) { transform: translateY(0); }
.btn-generate:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.gear-icon {
  display: inline-block;
  font-size: 1.1rem;
  transition: transform 0.3s;
}
.btn-generate.spinning .gear-icon {
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* ── STATUS BAR ────────────────────────────────────────────────────── */
.status-bar {
  text-align: center;
  font-style: italic;
  color: var(--brass-light);
  font-size: 0.95rem;
  min-height: 1.5rem;
  margin-bottom: 0.5rem;
  opacity: 0;
  transition: opacity 0.3s;
}
.status-bar.visible { opacity: 1; }

/* ── PHASE PIPELINE ────────────────────────────────────────────────── */
.phase-pipeline {
  display: flex;
  justify-content: center;
  gap: 0;
  margin: 1rem 0 2rem;
  font-family: var(--font-display);
  font-size: 0.62rem;
  letter-spacing: 0.1em;
}

.phase-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  padding: 0.5rem 0.75rem;
  color: var(--ink-faint);
  position: relative;
  transition: color 0.3s;
}
.phase-step + .phase-step::before {
  content: '──';
  position: absolute;
  left: -0.5rem;
  top: 0.85rem;
  color: var(--brass-dark);
  font-size: 0.7rem;
}
.phase-step.active  { color: var(--gold); }
.phase-step.done    { color: var(--brass-light); }

.phase-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brass-dark);
  transition: background 0.3s, box-shadow 0.3s;
}
.phase-step.active .phase-dot {
  background: var(--gold);
  box-shadow: 0 0 8px var(--gold);
  animation: pulse-dot 1s ease-in-out infinite;
}
.phase-step.done .phase-dot { background: var(--brass); }

@keyframes pulse-dot {
  0%, 100% { transform: scale(1); }
  50%       { transform: scale(1.4); }
}

/* ── PORTRAIT ───────────────────────────────────────────────────────── */
.btn-gen-portrait {
  margin-top: 0.6rem;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background: transparent;
  border: 1px solid var(--brass-dark);
  border-radius: var(--radius);
  color: var(--brass-light);
  font-family: var(--font-display);
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0.4rem 1rem;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.btn-gen-portrait:hover:not(:disabled) {
  background: var(--brass-dark);
  color: var(--parchment);
  border-color: var(--brass);
}
.btn-gen-portrait:disabled { opacity: 0.5; cursor: not-allowed; }

.portrait-wrap {
  margin-top: 0.75rem;
}
.portrait-wrap img {
  display: block;
  max-width: 320px;
  border-radius: var(--radius-lg);
  border: 2px solid var(--brass-dark);
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
.portrait-actions {
  margin-top: 0.5rem;
  display: flex;
  gap: 0.5rem;
  align-items: center;
}
.portrait-error {
  color: var(--rust);
  font-style: italic;
  font-size: 0.9rem;
  margin-top: 0.5rem;
}

/* ── AI LOADING PLACEHOLDER ────────────────────────────────────────── */
.ai-loading-placeholder .card-header {
  border-bottom: 1px solid var(--parchment-deep);
}
.loading-gear {
  display: inline-block;
  animation: spin 1.4s linear infinite;
  color: var(--brass-dark);
}
.shimmer-line {
  height: 0.8rem;
  border-radius: 3px;
  background: linear-gradient(90deg,
    var(--parchment-dark) 0%,
    var(--parchment-deep) 40%,
    var(--parchment-dark) 80%
  );
  background-size: 300% 100%;
  animation: shimmer 1.8s ease-in-out infinite;
  margin-bottom: 0.65rem;
}
@keyframes shimmer {
  0%   { background-position: 200% center; }
  100% { background-position: -100% center; }
}

/* ── CARD BASE ─────────────────────────────────────────────────────── */
.card {
  background: linear-gradient(160deg, var(--parchment) 0%, var(--parchment-dark) 100%);
  border: 1px solid var(--parchment-deep);
  border-radius: var(--radius-lg);
  box-shadow:
    0 4px 24px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.4);
  overflow: hidden;
  margin-bottom: 1.5rem;
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.card.revealed {
  opacity: 1;
  transform: translateY(0);
}

.card-header {
  background: linear-gradient(90deg, var(--brass-dark), var(--brass), var(--brass-dark));
  padding: 0.6rem 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
}
.card-title {
  font-family: var(--font-display);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  color: var(--parchment);
  text-transform: uppercase;
}
.card-body { padding: 1.25rem 1.5rem; }

/* ── STAT BLOCK ────────────────────────────────────────────────────── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.75rem;
}

.stat-cell {
  background: rgba(42,31,20,0.08);
  border: 1px solid var(--parchment-deep);
  border-radius: var(--radius);
  padding: 0.75rem 0.5rem;
  text-align: center;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.15s;
  position: relative;
  overflow: hidden;
}
.stat-cell:hover {
  background: rgba(42,31,20,0.14);
  border-color: var(--brass);
  transform: translateY(-1px);
}
.stat-cell:hover .stat-reroll-hint { opacity: 1; }

.stat-name {
  font-family: var(--font-display);
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  color: var(--ink-faint);
  text-transform: uppercase;
  display: block;
  margin-bottom: 0.2rem;
}
.stat-value {
  font-family: var(--font-display);
  font-size: 2rem;
  font-weight: 700;
  color: var(--brass-dark);
  line-height: 1;
  display: block;
  transition: color 0.3s;
}
.stat-cell.rolling .stat-value {
  animation: roll-flicker 0.6s ease-out;
}
@keyframes roll-flicker {
  0%   { opacity: 0.3; transform: scale(0.8); }
  50%  { opacity: 1;   transform: scale(1.1); color: var(--gold); }
  100% { opacity: 1;   transform: scale(1);   }
}

.stat-bar {
  height: 3px;
  background: var(--parchment-deep);
  border-radius: 2px;
  margin-top: 0.4rem;
  overflow: hidden;
}
.stat-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--brass-dark), var(--gold));
  border-radius: 2px;
  transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1);
  width: 0;
}

.stat-reroll-hint {
  position: absolute;
  bottom: 3px;
  right: 5px;
  font-size: 0.55rem;
  color: var(--brass);
  opacity: 0;
  transition: opacity 0.2s;
  font-family: var(--font-display);
  letter-spacing: 0.05em;
}

/* ── IDENTITY ROW ──────────────────────────────────────────────────── */
.identity-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1.5rem;
  margin-bottom: 1rem;
}
.identity-item {
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}
.identity-label {
  font-family: var(--font-display);
  font-size: 0.58rem;
  letter-spacing: 0.14em;
  color: var(--ink-faint);
  text-transform: uppercase;
}
.identity-value {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--ink);
}

/* ── MBTI BADGE ────────────────────────────────────────────────────── */
.mbti-badge {
  display: inline-flex;
  align-items: baseline;
  gap: 0.4rem;
}
.mbti-type {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--brass-dark);
  letter-spacing: 0.05em;
}
.mbti-label {
  font-style: italic;
  color: var(--ink-faint);
  font-size: 0.9rem;
}

/* ── SKELETON ROWS ─────────────────────────────────────────────────── */
.skeleton-row {
  display: flex;
  gap: 0.5rem;
  padding: 0.55rem 0;
  border-bottom: 1px solid rgba(42,31,20,0.1);
  align-items: flex-start;
  flex-wrap: wrap;
}
.skeleton-row:last-child { border-bottom: none; }

.skeleton-key {
  font-family: var(--font-display);
  font-size: 0.6rem;
  letter-spacing: 0.14em;
  color: var(--brass-dark);
  text-transform: uppercase;
  min-width: 100px;
  padding-top: 0.15rem;
  flex-shrink: 0;
}
.skeleton-val {
  font-size: 0.92rem;
  color: var(--ink);
  flex: 1;
}

/* ── SECRET SEVERITY ───────────────────────────────────────────────── */
.severity-badge {
  display: inline-block;
  font-family: var(--font-display);
  font-size: 0.55rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.15rem 0.5rem;
  border-radius: 2px;
  margin-right: 0.4rem;
  vertical-align: middle;
}
.severity-low       { background: var(--verdigris);  color: #fff; }
.severity-medium    { background: var(--steel);       color: #fff; }
.severity-high      { background: var(--copper);      color: #fff; }
.severity-explosive { background: var(--rust);        color: #fff; }

/* ── CAST GRID ─────────────────────────────────────────────────────── */
.cast-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 0.75rem;
}
.cast-card {
  background: rgba(42,31,20,0.06);
  border: 1px solid var(--parchment-deep);
  border-radius: var(--radius);
  padding: 0.75rem 1rem;
}
.cast-name {
  font-family: var(--font-display);
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--brass-dark);
  margin-bottom: 0.15rem;
}
.cast-role {
  font-size: 0.78rem;
  font-style: italic;
  color: var(--ink-faint);
  margin-bottom: 0.4rem;
}
.cast-status-badge {
  display: inline-block;
  font-size: 0.65rem;
  font-family: var(--font-display);
  letter-spacing: 0.08em;
  color: var(--brass-dark);
  background: rgba(184,115,51,0.12);
  border: 1px solid rgba(184,115,51,0.2);
  border-radius: 2px;
  padding: 0.1rem 0.4rem;
  margin-bottom: 0.4rem;
}
.cast-traits {
  font-size: 0.8rem;
  color: var(--ink-light);
  font-style: italic;
  margin-bottom: 0.3rem;
}
.cast-dynamic {
  font-size: 0.82rem;
  color: var(--ink);
  line-height: 1.4;
}

/* ── OUTPUT FIELDS (AI Dungeon) ────────────────────────────────────── */
.output-field {
  margin-bottom: 1rem;
}
.field-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.4rem;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.field-label {
  font-family: var(--font-display);
  font-size: 0.62rem;
  letter-spacing: 0.16em;
  color: var(--brass-dark);
  text-transform: uppercase;
}
.field-meta {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.char-count {
  font-family: monospace;
  font-size: 0.72rem;
  color: var(--ink-faint);
}
.char-count.over { color: var(--rust); font-weight: bold; }

.field-textarea {
  width: 100%;
  background: rgba(42,31,20,0.06);
  border: 1px solid var(--parchment-deep);
  border-radius: var(--radius);
  padding: 0.75rem 1rem;
  font-family: var(--font-body);
  font-size: 0.9rem;
  line-height: 1.6;
  color: var(--ink);
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
  min-height: 80px;
}
.field-textarea:focus { border-color: var(--brass); }
.field-input {
  width: 100%;
  background: rgba(42,31,20,0.06);
  border: 1px solid var(--parchment-deep);
  border-radius: var(--radius);
  padding: 0.6rem 1rem;
  font-family: var(--font-body);
  font-size: 0.95rem;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s;
}
.field-input:focus { border-color: var(--brass); }

/* ── TAGS ──────────────────────────────────────────────────────────── */
.tags-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}
.tag-pill {
  display: inline-block;
  font-family: var(--font-display);
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  padding: 0.25rem 0.65rem;
  background: rgba(184,115,51,0.12);
  border: 1px solid rgba(184,115,51,0.25);
  border-radius: 20px;
  color: var(--brass-dark);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.tag-pill:hover {
  background: rgba(184,115,51,0.22);
  border-color: var(--brass);
}

/* ── COPY BUTTONS ──────────────────────────────────────────────────── */
.btn-copy {
  background: transparent;
  border: 1px solid var(--brass-dark);
  border-radius: var(--radius);
  color: var(--brass);
  font-family: var(--font-display);
  font-size: 0.58rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.25rem 0.65rem;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
}
.btn-copy:hover {
  background: var(--brass-dark);
  color: var(--parchment);
}
.btn-copy.copied {
  background: var(--verdigris);
  border-color: var(--verdigris);
  color: #fff;
}

/* ── NPC ENTRY SECTION ─────────────────────────────────────────────── */
.npc-section { margin-bottom: 1rem; }
.npc-section-name {
  font-family: var(--font-display);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  color: var(--brass-dark);
  margin-bottom: 0.4rem;
}

/* ── COPY ALL BUTTON ───────────────────────────────────────────────── */
.copy-all-wrap {
  text-align: center;
  margin: 2rem 0 1rem;
}
.btn-copy-all {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background: transparent;
  border: 1px solid var(--brass);
  border-radius: var(--radius);
  color: var(--gold);
  font-family: var(--font-display);
  font-size: 0.75rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 0.65rem 2rem;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.btn-copy-all:hover {
  background: rgba(184,115,51,0.15);
}

/* ── ERROR ─────────────────────────────────────────────────────────── */
.error-box {
  background: rgba(139,58,42,0.15);
  border: 1px solid var(--rust);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  color: var(--rust);
  font-size: 0.9rem;
  margin: 1rem 0;
  display: none;

}

  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

  font-style: italic;
  color: var(--brass-dark);
  opacity: 0.6;

  .phase-step span { display: none; }
  .api-section     { flex-direction: column; align-items: stretch; }

function poolFor(broad) { return NAME_POOLS[broad] ?? NAME_POOLS['default']; }

function pickFirst(genderId, pool) {
  if (['man','trans_man'].includes(genderId))     return uniformPick(pool.masc);
  if (['woman','trans_woman'].includes(genderId)) return uniformPick(pool.fem);
  const r = Math.random();
  return r < 0.4 ? uniformPick(pool.neutral) : r < 0.7 ? uniformPick(pool.masc) : uniformPick(pool.fem);
}

function protoName(genderId, ethnicityBroad) {
  const pool = poolFor(ethnicityBroad);
  const first = pickFirst(genderId, pool);
  const last  = uniformPick(pool.last);
  return { first, last, full: `${first} ${last}` };
}

function neutralName() {
  const first = Math.random() < 0.5 ? uniformPick(NEUTRAL_FIRST_MASC) : uniformPick(NEUTRAL_FIRST_FEM);
  return `${first} ${uniformPick(NEUTRAL_LAST)}`;
}

function familyFirst(genderId, ethnicityBroad) {
  return pickFirst(genderId, poolFor(ethnicityBroad));
}

function altLastName(currentLast, ethnicityBroad, namePools) {
  const opts = (namePools[ethnicityBroad] ?? namePools['default']).last.filter(n => n !== currentLast);
  return uniformPick(opts.length ? opts : (namePools[ethnicityBroad] ?? namePools['default']).last);
}

    SIBLING_DYNAMICS,
    ECONOMIC_TIERS,
    CITY_SETTINGS,
    TAG_POOLS,
    RACES_OR_ETHNICITIES: ETHNICITIES,
    GENDERS,
    ORIENTATIONS,
    BUILDS,
    HAIR: HAIR.map(h => ({ label: h })),
    DISTINGUISHING_FEATURES: DISTINGUISHING_FEATURES.map(l => ({ label: l })),
    QUIRKS,
    NAME_POOLS,
  };
}

// GENERATOR ENGINE — inlined (no imports)
// ═══════════════════════════════════════════════════════════════════════════

// ── Selectors ────────────────────────────────────────────────────────────
function uniformPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function uniformPickN(arr, n) { return [...arr].sort(() => Math.random() - 0.5).slice(0, Math.min(n, arr.length)); }
function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function weightedPick(arr) {
  const total = arr.reduce((s, i) => s + (i.weight ?? 1), 0);
  let r = Math.random() * total;
  for (const item of arr) { r -= (item.weight ?? 1); if (r <= 0) return item; }
  return arr[arr.length - 1];
}

function effectiveWeight(item, stats, base = 10) {
  const aff = item.statAffinity ?? {};
  let m = 1;
  for (const [stat, factor] of Object.entries(aff)) {
    if (stats[stat] !== undefined) m *= 1 + (factor - 1) * (stats[stat] / 100);
  }
  return Math.max(0.1, (item.weight ?? base) * m);
}

function statWeightedPick(arr, stats) {
  const w = arr.map(i => ({ item: i, weight: effectiveWeight(i, stats) }));
  const total = w.reduce((s, x) => s + x.weight, 0);
  let r = Math.random() * total;
  for (const { item, weight } of w) { r -= weight; if (r <= 0) return item; }
  return w[w.length - 1].item;
}

function statAndWeightPick(arr, stats) {
  const w = arr.map(i => ({ item: i, weight: effectiveWeight(i, stats, i.weight ?? 10) }));
  const total = w.reduce((s, x) => s + x.weight, 0);
  let r = Math.random() * total;
  for (const { item, weight } of w) { r -= weight; if (r <= 0) return item; }
  return w[w.length - 1].item;
}

// ── Stat rolling ─────────────────────────────────────────────────────────
function rollStat() {
  return Math.min(100, Math.max(1, Math.round((Math.random()*100+1 + Math.random()*100+1) / 2)));
}
function rollStats() {
  return { strength:rollStat(), intelligence:rollStat(), wisdom:rollStat(), charisma:rollStat(), dexterity:rollStat(), constitution:rollStat() };
}

// ── MBTI ─────────────────────────────────────────────────────────────────
function norm(v, min, max) { return Math.min(1, Math.max(0, (v - min) / (max - min))); }
function decide(p) { return Math.random() < p; }

function assignMBTI(s) {
  const isE = decide(norm((s.charisma + s.strength)/2 - (s.wisdom + s.intelligence)/2 + 50, 0, 100));
  const isN = decide(norm((s.intelligence + s.wisdom)/2 - (s.constitution + s.strength)/2 + 50, 0, 100));
  const isT = decide(norm(s.intelligence - (s.charisma + s.wisdom)/2 + 50, 0, 100));
  const isJ = decide(norm((s.wisdom + s.constitution)/2 - (s.charisma + s.dexterity)/2 + 50, 0, 100));
  const typeStr = `${isE?'E':'I'}${isN?'N':'S'}${isT?'T':'F'}${isJ?'J':'P'}`;
  return MBTI_TYPES.find(m => m.type === typeStr) ?? MBTI_TYPES[0];
}

const FRIEND_DYNAMICS = [
  'The person {n} calls when things go sideways — and they always pick up',
  'Has covered for {n} before. Will probably have to again.',
  'Believes in {n} more than {n} believes in themselves',
  'The only person who can make {n} laugh when things are genuinely terrible',
  'Has their own chaos, but shows up for {n} anyway',
  'Knows every embarrassing story and has never weaponised one',
  'Drifted for a while; they\'re close again now, pretending the gap never happened',
  'Would absolutely help {n} move a body. No questions. Light snacks provided.',
  'The voice in {n}\'s head that says "are you sure about this?" — usually right',
  'Knows {n} better than anyone and has decided to stay anyway',
];
const PARENT_DYNAMICS_ALIVE = [
  '{n} calls more often than they admit and less often than they mean to',
  'Has opinions about every choice {n} has made since roughly age seven',
  'Proud of {n} in ways they mostly express sideways, at inconvenient moments',
  'The relationship has improved significantly since {n} moved out',
  'Still sends clippings — actual clippings — of things they think {n} should know',
  'Knows something is wrong with {n} right now and is waiting to be asked',
  '{n} inherited exactly the traits they were hoping to avoid',
];
const FOIL_ROLES = [
  { role:'rival', dynamics:['Wants what {n} has — and is closer to getting it than {n} realises','Grew up alongside {n}; the competition technically never ended','Respects {n} just enough to make the rivalry feel personal','The only person who can beat {n} — which {n} finds both infuriating and motivating'] },
  { role:'antagonist', dynamics:["Has a reason to want things to go badly for {n} — and the patience to wait","Operates in the same world as {n}, just on the other side of a line","Knows something about {n} that {n} wishes they didn't","Honestly believes they're the reasonable one in this situation"] },
  { role:'love interest', dynamics:["Has known {n} long enough to see past the performance — still here","Wants more from {n} than {n} knows how to give right now","The timing has never been right. Might never be. They're both ignoring this.","Finds {n}'s specific brand of disaster oddly endearing"] },
  { role:'estranged former ally', dynamics:["Used to be the person {n} trusted most. Something happened. Neither talks about it.","Resurfaces at exactly the wrong moment, as they always do","Could be an asset or a liability — {n} genuinely doesn't know which"] },
];
const SIBLING_MAP = {
  protective_older:   n => `Stepped up for ${n} when no one else did — a habit they haven't broken`,
  rivalry:            n => `The competition with ${n} started in childhood and technically never stopped`,
  estranged:          n => `${n} and them haven't spoken in years. The reason is known. Unremarked upon.`,
  close_ally:         n => `The one person ${n} tells everything to, including the parts they shouldn't`,
  troubled:           n => `${n} is the "stable" one in this equation, which is its own kind of funny`,
  golden_child:       n => `The family benchmark — ${n} has spent years being measured against them without consent`,
  lost_touch:         n => `They were close once. Drifted. ${n} still occasionally drafts messages and doesn't send them`,
  deceased:           n => `Gone — and ${n} still sometimes forgets, for a moment, before remembering again`,
  younger_dependent:  n => `Looks to ${n} for stability ${n} is largely improvising`,
  reconnecting:       n => `Back in ${n}'s life after years away, both pretending it wasn't that long`,
};

function fillD(t, n) { return t.replace(/\{n\}/g, n); }
function pickTraits(n) { return uniformPickN(NPC_TRAITS, n); }

function buildCast(protName, protLast, ethnicityBroad, familyStructure, tables) {
  const namePools = tables.NAME_POOLS;
  const SIBLING_DYN = tables.SIBLING_DYNAMICS;
  const PARENT_STAT = tables.PARENT_STATUSES;
  const cast = [];
  const MAX = 7;
  const pc = familyStructure.parentCount ?? 0;

  function _parentName(isMother) {
    const pool = namePools[ethnicityBroad] ?? namePools['default'];
    const fn = isMother ? uniformPick(pool.fem) : uniformPick(pool.masc);
    return fn;
  }
  function _buildParent(role, structure) {
    let status;
    const id = structure.id;
    if (id === 'two_parent_one_deceased') {
      status = role === 'deceased' ? uniformPick(PARENT_STAT.filter(s => s.id.startsWith('deceased')))
             : uniformPick(PARENT_STAT.filter(s => !s.id.startsWith('deceased') && s.id !== 'absent_unknown'));
    } else if (id === 'two_parent_one_absent') {
      status = role === 'absent' ? uniformPick(PARENT_STAT.filter(s => s.id === 'absent_unknown' || s.id === 'estranged'))
             : uniformPick(PARENT_STAT.filter(s => !s.id.startsWith('deceased') && s.id !== 'absent_unknown'));
    } else if (['foster_care','orphaned_early','raised_by_grandparents','raised_by_older_sibling','temple_raised','guild_raised','war_orphan'].includes(id)) {
      status = uniformPick(PARENT_STAT.filter(s => s.id.startsWith('deceased') || s.id === 'absent_unknown' || s.id === 'estranged' || s.id === 'missing'));
    } else {
      status = uniformPick(PARENT_STAT);
    }
    const isDeceased = status.id.startsWith('deceased') || status.id === 'missing';
    const isAbsent   = status.id === 'absent_unknown';
    const isDivorced = id === 'two_parent_divorced';
    const isMother   = role === 'mother';
    const useDiffLast = isAbsent || (isDivorced && isMother && Math.random() < 0.5);
    const lastName = useDiffLast ? altLastName(protLast, ethnicityBroad, namePools) : protLast;
    const firstName = _parentName(isMother);
    const dynamic = isDeceased
      ? `${protName} still catches themselves thinking "I should call" before remembering`
      : fillD(uniformPick(PARENT_DYNAMICS_ALIVE), protName);
    return { name:`${firstName} ${lastName}`, role:isMother?'mother':'father', status:status.label, traits:pickTraits(2), dynamic };
  }

  if (pc === 2) {
    const isOneDeceased = familyStructure.id === 'two_parent_one_deceased';
    const isOneAbsent   = familyStructure.id === 'two_parent_one_absent';
    const mRole = isOneDeceased ? (Math.random()<0.5?'deceased':'surviving')
                : isOneAbsent   ? (Math.random()<0.5?'absent':'present') : 'present';
    const fRole = isOneDeceased ? (mRole==='deceased'?'surviving':'deceased')
                : isOneAbsent   ? (mRole==='absent'?'present':'absent') : 'present';
    cast.push(_buildParent('mother', {...familyStructure, _r:mRole}));
    cast.push(_buildParent('father', {...familyStructure, _r:fRole}));
  } else if (pc === 1) {
    const g = familyStructure.parentGender ?? (Math.random()<0.5?'mother':'father');
    cast.push(_buildParent(g, familyStructure));
  }

  const [minS, maxS] = familyStructure.siblingCount ?? [0,0];
  const sibSlots = Math.min(randomInt(minS, maxS), 2, MAX - cast.length - 2);
  for (let i = 0; i < sibSlots; i++) {
    const dyn = uniformPick(SIBLING_DYN);
    const genderId = Math.random() < 0.5 ? 'man' : 'woman';
    const pool = namePools[ethnicityBroad] ?? namePools['default'];
    const firstName = genderId === 'man' ? uniformPick(pool.masc) : uniformPick(pool.fem);
    const isOlder = ['protective_older','golden_child'].includes(dyn.id);
    const isYounger = dyn.id === 'younger_dependent';
    cast.push({
      name: `${firstName} ${protLast}`,
      role: isOlder ? 'older sibling' : isYounger ? 'younger sibling' : 'sibling',
      status: dyn.id === 'deceased' ? 'deceased' : dyn.label,
      traits: pickTraits(2),
      dynamic: (SIBLING_MAP[dyn.id] ?? (n => `Part of ${n}'s story in ways that are hard to untangle`))(protName),
    });
  }

  const friendSlots = Math.min(randomInt(1,2), MAX - cast.length - 1);
  for (let i = 0; i < friendSlots; i++) {
    cast.push({ name:neutralName(), role:'best friend', status:'present and close', traits:pickTraits(3), dynamic:fillD(uniformPick(FRIEND_DYNAMICS), protName) });
  }

  if (cast.length < MAX) {
    const foilType = uniformPick(FOIL_ROLES);
    cast.push({ name:neutralName(), role:foilType.role, status:'present', traits:pickTraits(2), dynamic:fillD(uniformPick(foilType.dynamics), protName) });
  }
  return cast;
}

// ── Skeleton builder ──────────────────────────────────────────────────────
function buildSkeleton(stats, mbti, tables) {
  const { PROFESSIONS:P, LIFE_EVENTS:LE, TENSIONS:T, SECRETS:S, FAMILY_STRUCTURES:FS,
          ECONOMIC_TIERS:ET, CITY_SETTINGS:CS, TAG_POOLS:TP,
          RACES_OR_ETHNICITIES:ROE, GENDERS:G, ORIENTATIONS:O,
          BUILDS:B, HAIR:H, DISTINGUISHING_FEATURES:DF, QUIRKS:Q, NAME_POOLS:NP } = tables;

  const gender      = statAndWeightPick(G, stats);
  const orientation = weightedPick(O);
  const identity    = statAndWeightPick(ROE, stats);
  const namePool    = NP[identity.broad] ?? NP['default'];
  const nameResult  = protoName(gender.id, namePool);
  const name        = nameResult.full;
  const lastName    = nameResult.last;
  const ageRoll     = Math.random();
  const age         = ageRoll < 0.1 ? randomInt(19,24) : ageRoll < 0.75 ? randomInt(25,45) : ageRoll < 0.95 ? randomInt(46,58) : randomInt(59,70);
  const build       = statWeightedPick(B, stats);
  const hairItem    = uniformPick(H);
  const hair        = typeof hairItem === 'string' ? hairItem : hairItem.label;
  const feat        = Math.random() < 0.25 ? null : uniformPick(DF.filter(f => f.label)).label;
  const quirk       = statWeightedPick(Q, stats);
  const profession  = statWeightedPick(P, stats);
  const sentiment   = uniformPick(profession.sentiments);
  const famStruct   = statWeightedPick(FS, stats);
  const lifeEvent   = statWeightedPick(LE, stats);
  let tier = profession.economicTier + (lifeEvent.economicHint ?? 0) + (famStruct.economicHint ?? 0);
  tier = Math.min(5, Math.max(1, Math.round(tier)));
  const econ = ET[tier];
  const econMarkers = [...econ.descriptors].sort(() => Math.random()-0.5).slice(0,2);
  const tension  = statWeightedPick(T, stats);
  const secret   = statWeightedPick(S, stats);
  const city     = statWeightedPick(CS, stats);
  const cast     = buildCast(name, lastName, identity.broad, famStruct, tables);

  // assemble tags
  const tags = new Set(TP.always);
  if (TP[city.toneTag]) TP[city.toneTag].forEach(t => tags.add(t));
  if (TP[tension.toneTag]) TP[tension.toneTag].forEach(t => tags.add(t));
  if (tension.criminalFlag && TP.criminal) TP.criminal.forEach(t => tags.add(t));
  (TP.professionTags?.[profession.industry] ?? []).forEach(t => tags.add(t));
  if (secret.severity === 'explosive' || secret.severity === 'high') { tags.add('secrets'); tags.add('betrayal'); }

  return {
    name, age,
    gender: gender.label, pronouns: gender.pronouns,
    orientation: orientation.label,
    ethnicityBroad: identity.broad, ethnicityFlavor: identity.flavor,
    appearance: { build: build.label, hair, distinguishingFeature: feat },
    quirk: quirk.quirk,
    stats, mbti: mbti.type, mbtiLabel: mbti.label,
    profession: profession.title, industry: profession.industry,
    economicTier: tier, economicLabel: econ.label,
    economicMarkers: econMarkers,
    housing: uniformPick(econ.housing), transport: uniformPick(econ.transport),
    cityLabel: city.label, cityFlavor: city.flavor,
    sentiment, lifeEvent: lifeEvent.description,
    tension: tension.description, secret: secret.description,
    secretSeverity: secret.severity,
    tags: [...tags].slice(0,10),
    cast,
  };
}

// ── Prompt builder ────────────────────────────────────────────────────────
const SYSTEM_PROMPT = `You are a creative writer generating AI Dungeon scenario content.
Your output must be vivid, specific, and immediately usable as a game scenario.

TONE — this is critical:
These characters are for a game. Players should want to play them.
Write with energy, wit, and a light touch even when the material is dark.
Dark comedy is welcome. Characters should feel alive, flawed, and fun — not just tragic.
A character drowning in debt can still be the funniest person in the room.
A burned-out nurse can love her job at 7am and hate it by noon.
Misery is a seasoning, not the whole dish.
Every character should have at least one quality that makes you root for them.

STYLE:
- Behavioral prose — show character through action, detail, and implication. Never explain.
- Never mention stat numbers, MBTI types by name, or any generation metadata.
- Never state ethnicity, orientation, or gender as labels — weave them naturally.
- Use sentence fragments where they sharpen the prose.
- Stay within the exact character limits given. Count carefully.

Output only the JSON structure requested. No preamble, no commentary, no markdown fences.`;

function buildPrompt(sk, genre) {
  const castLines = sk.cast.map(npc =>
    `  - ${npc.name} (${npc.role}, ${npc.status}): ${npc.traits.join(', ')}. ${npc.dynamic}`
  ).join('\n');
  const appParts = [sk.appearance.build, sk.appearance.hair, sk.appearance.distinguishingFeature].filter(Boolean).join('; ');
  const identityLabel = genre === 'fantasy' ? 'Race' : 'Ethnicity';
  const genreLabel    = genre === 'fantasy' ? 'fantasy' : 'AI Dungeon';
  const entryNote     = genre === 'fantasy'
    ? 'Lead with name, rough age, role. Weave in race appearance and quirk through behavior. Ground in sensory fantasy detail. End on forward momentum.'
    : 'Lead with name, age, role. Use sentence fragments. Fold in appearance and quirk through behavior. Reference key cast members. End on forward momentum.';
  const openingNote   = genre === 'fantasy'
    ? 'Second person. Drop the player into a vivid fantasy moment right now — mid-scene. Sensory detail (smells, sounds, weight of gear). End mid-moment with a clear choice.'
    : 'Second person. Drop the player directly into a vivid, specific moment — right now. Sensory detail. End mid-moment with a clear next decision.';
  const appearanceNote = genre === 'fantasy'
    ? 'Comma-separated visual descriptors for a text-to-image model. Start with "portrait of" then: race, age range, gender, body type, hair color and style, eye description, distinguishing feature if any, armor or clothing suited to their role, setting mood. Include "face of [a historical figure, classical warrior, or well-known portrait subject whose gender, racial appearance, and approximate age match this character]". Close with: fantasy character art, detailed digital illustration, dramatic lighting. No sentences — descriptors only.'
    : 'Comma-separated visual descriptors for a text-to-image model. Start with "portrait of" then: age range, gender, body type, hair color and style, eye description, distinguishing feature if any, outfit suited to their job and economic tier, setting mood. Include "face of [a historical figure or classic-cinema figure whose gender, ethnicity, and approximate age match this character — someone whose likeness is well-documented in photographs or portraiture]". Close with: photorealistic, cinematic lighting. No sentences — descriptors only.';

  return `Generate ${genreLabel} content for this character. Return a single JSON object with these exact keys:
"characterEntry", "npcEntries", "title", "description", "tags", "opening", "appearancePrompt"

CHARACTER SKELETON:
Name: ${sk.name}, ${sk.age}, ${sk.gender} (${sk.pronouns})
${identityLabel}: ${sk.ethnicityFlavor}
Orientation: ${sk.orientation}
Appearance: ${appParts}
Quirk: ${sk.quirk}
Profession: ${sk.profession} (${sk.industry}) — feels ${sk.sentiment} about it
Stats: STR ${sk.stats.strength} | INT ${sk.stats.intelligence} | WIS ${sk.stats.wisdom} | CHA ${sk.stats.charisma} | DEX ${sk.stats.dexterity} | CON ${sk.stats.constitution}
Personality: ${sk.mbti} — ${sk.mbtiLabel}
Economic status: ${sk.economicLabel} — ${(sk.econMarkers || sk.economicMarkers).join('; ')}
Housing: ${sk.housing} | Transport: ${sk.transport}
Setting: ${sk.cityLabel} — ${sk.cityFlavor}
Formative event: ${sk.lifeEvent}
Current tension: ${sk.tension}
Secret (severity: ${sk.secretSeverity}): ${sk.secret}

SUPPORTING CAST:
${castLines}

OUTPUT RULES:

"characterEntry": MAX 1000 chars. Terse behavioral prose. ${entryNote} Make the reader want to be this person, at least for an evening. Specific, alive, a little fun.

"npcEntries": Object keyed by NPC name. Each value MAX 1000 chars. Same style. Reference protagonist by name. These people should feel worth knowing.

"title": MAX 70 chars. Hook the player. Specific, evocative. Can be darkly funny if it fits.

"description": MAX 5000 chars. Second person ("You are..."). Set the scene: who the player is, what their world feels like, what's at stake. Weave in 2–3 cast members. Hint at the tension and secret without stating them plainly. End with something that makes the player want to begin.

"tags": Array of 8–10 lowercase strings. Genre-appropriate.

"opening": MAX 4000 chars. ${openingNote}

"appearancePrompt": MAX 500 chars. ${appearanceNote}`;
}

function parseResponse(raw) {
  try {
    const clean = raw.replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/```\s*$/i,'').trim();
    const p = JSON.parse(clean);
    return { characterEntry: p.characterEntry??'', npcEntries: p.npcEntries??{}, title: p.title??'', description: p.description??'', tags: p.tags??[], opening: p.opening??'', appearancePrompt: p.appearancePrompt??'' };
  } catch(e) { return null; }
}

// ── API call ──────────────────────────────────────────────────────────────
function getSystemPrompt(genre) {
  if (genre === 'fantasy') {
    return `You are a creative writer generating AI Dungeon fantasy scenario content.
Your output must be vivid, specific, and immediately usable as a game scenario.

TONE — this is critical:
These characters are for a game. Players should want to play them.
Write with energy, wit, and a light touch even when the material is dark.
Dark comedy is welcome. Fantasy characters should feel like real people who happen to live in a world with magic and monsters — not cardboard archetypes.
A broke sellsword can be the funniest person in the tavern. A fallen paladin can be genuinely good company while being a genuine mess.
Suffering is a seasoning, not the whole dish. Every character should have at least one quality that makes you want to spend time with them.

STYLE:
- Behavioral prose — show character through action, detail, and implication. Never explain.
- Never mention stat numbers, MBTI types, race labels, or generation metadata as clinical labels.
- Weave race, appearance, and quirk naturally into behavior and description.
- Ground descriptions in sensory detail — smells of forge smoke, the weight of armor, the sound of a crowded tavern.
- Stay within the exact character limits given.

Output only the JSON structure requested. No preamble, no commentary, no markdown fences.`;
  }
  return SYSTEM_PROMPT;
}

async function callClaude(skeleton, apiKey, genre) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 4096,
      system: getSystemPrompt(genre),
      messages: [{ role: 'user', content: buildPrompt(skeleton, genre) }],
    }),
  });
  if (!res.ok) { const t = await res.text().catch(()=>''); throw new Error(`API error ${res.status}: ${t}`); }
  const data = await res.json();
  const raw = data.content?.filter(b=>b.type==='text').map(b=>b.text).join('') ?? '';
  if (!raw) throw new Error('Empty response from API');
  const parsed = parseResponse(raw);
  if (!parsed) throw new Error('Failed to parse API response as JSON');
  return parsed;
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = msg;
  el.classList.toggle('visible', !!msg);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Copy to clipboard ─────────────────────────────────────────────────────
// Uses Clipboard API where available, falls back to execCommand for
// environments that block navigator.clipboard (iframes, non-HTTPS, etc.)
function copyToClipboard(text) {
  // Modern API first
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => {
      return execCommandCopy(text);
    });
  }
  return Promise.resolve(execCommandCopy(text));
}

function execCommandCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e) {
    return false;
  }
}

async function copyText(text, btn) {
  const originalHTML = btn.innerHTML;
  const ok = await copyToClipboard(text);
  if (ok) {
    btn.innerHTML = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = originalHTML; btn.classList.remove('copied'); }, 1800);
  } else {
    btn.innerHTML = '✗ Failed';
    setTimeout(() => { btn.innerHTML = originalHTML; }, 1800);
  }
}

// ── Char counter ──────────────────────────────────────────────────────────
function attachCounter(textarea, limit, counterId) {
  const counter = document.getElementById(counterId);
  if (!counter || !textarea) return;
  const update = () => {
    const len = textarea.value.length;
    const remaining = limit - len;
    counter.textContent = `${len} / ${limit}`;
    counter.classList.toggle('over', remaining < 0);
  };
  textarea.addEventListener('input', update);
  update();
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════════════════════════════════
// INTERACTIVE FUNCTIONS
// ═══════════════════════════════════════════════════════════════════════════

function updateCount(el, counterId, limit) {
  const counter = document.getElementById(counterId);
  if (!counter) return;
  counter.textContent = `${el.value.length} / ${limit}`;
  counter.classList.toggle('over', el.value.length > limit);
}

async function copyField(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  await copyText(el.value ?? el.textContent, btn);
}

async function copyTags(btn) {
  const pills = document.querySelectorAll('#tags-wrap .tag-pill');
  const text = Array.from(pills).map(p => p.textContent).join(', ');
  await copyText(text, btn);
}

async function copyAll(btn) {
  if (!currentOutput || !currentSkeleton) return;
  const payload = {
    skeleton: currentSkeleton,
    scenario: {
      title:           currentOutput.title,
      description:     currentOutput.description,
      tags:            currentOutput.tags,
      opening:         currentOutput.opening,
      appearancePrompt: currentOutput.appearancePrompt,
    },
    characters: {
      [currentSkeleton.name]: currentOutput.characterEntry,
      ...currentOutput.npcEntries,
    },
  };
  await copyText(JSON.stringify(payload, null, 2), btn);
}

function copySkeletonText(btn) {
  if (!currentSkeleton) return;
  const sk = currentSkeleton;
  const app = [sk.appearance.build, sk.appearance.hair, sk.appearance.distinguishingFeature].filter(Boolean).join(', ');
  const text = [
    `${sk.name}, ${sk.age}, ${sk.gender} (${sk.pronouns})`,
    `Ethnicity: ${sk.ethnicityBroad}`,
    `Stats: STR ${sk.stats.strength} | INT ${sk.stats.intelligence} | WIS ${sk.stats.wisdom} | CHA ${sk.stats.charisma} | DEX ${sk.stats.dexterity} | CON ${sk.stats.constitution}`,
    `MBTI: ${sk.mbti} — ${sk.mbtiLabel}`,
    `Profession: ${sk.profession} (${sk.industry}) — ${sk.sentiment}`,
    `Appearance: ${app}`,
    `Quirk: ${sk.quirk}`,
    `Economy: ${sk.economicLabel} · ${sk.housing} · ${sk.transport}`,
    `City: ${sk.cityLabel}`,
    `Life event: ${sk.lifeEvent}`,
    `Tension: ${sk.tension}`,
    `Secret [${sk.secretSeverity}]: ${sk.secret}`,
  ].join('\n');
  copyToClipboard(text);
}

async function rerollStat(statName) {
  if (isGenerating || !currentSkeleton) return;
  const newVal = Math.min(100, Math.max(1, Math.round((Math.random()*100+1 + Math.random()*100+1)/2)));
  currentSkeleton.stats[statName] = newVal;

  const valEl = document.getElementById(`stat-${statName}`);
  const barEl = document.getElementById(`bar-${statName}`);
  if (valEl) {
    valEl.textContent = newVal;
    valEl.closest('.stat-cell').classList.add('rolling');
    setTimeout(() => valEl.closest('.stat-cell')?.classList.remove('rolling'), 700);
  }
  if (barEl) barEl.style.width = `${newVal}%`;
}

// ═══════════════════════════════════════════════════════════════════════════
// MAIN GENERATE FLOW
// ═══════════════════════════════════════════════════════════════════════════

async function runGenerate() {
  if (isGenerating) return;
  const apiKey = document.getElementById('api-key').value.trim();
  if (!apiKey) {
    showError('Please enter your Anthropic API key to generate narrative content. (You can find it at console.anthropic.com)');
    return;
  }

  isGenerating = true;
  showError('');
  const btn = document.getElementById('btn-generate');
  btn.disabled = true;
  btn.classList.add('spinning');

  // Clear old output
  document.getElementById('output-area').innerHTML = '';

  try {
    // Phase 1 — Roll stats
    setPhase('phase-roll');
    setStatus('The gears begin to turn…');
    await sleep(300);
    const stats = rollStats();

    // Phase 2 — MBTI
    setPhase('phase-mbti');
    setStatus('Consulting the personality oracle…');
    await sleep(250);
    const mbti = assignMBTI(stats);

    // Phase 3 — Skeleton
    setPhase('phase-skeleton');
    setStatus('Weaving the threads of fate…');
    await sleep(300);
    const tables = getGenreTables(currentGenre);
    const skeleton = buildSkeleton(stats, mbti, tables);
    currentSkeleton = skeleton;

    // Render skeleton immediately
    const outputArea = document.getElementById('output-area');
    outputArea.innerHTML = renderSkeleton(skeleton);
    await sleep(50);
    document.querySelectorAll('.card').forEach((c, i) => {
      setTimeout(() => c.classList.add('revealed'), i * 120);
    });

    // Phase 4 — AI narrative
    setPhase('phase-ai');
    setStatus('Summoning the narrative…');

    outputArea.insertAdjacentHTML('beforeend', `
      <div id="ai-placeholder" class="card ai-loading-placeholder revealed">
        <div class="card-header">
          <span class="card-title"><span class="loading-gear">⚙</span> Generating Scenario…</span>
        </div>
        <div class="card-body" style="padding:1.25rem 1.5rem;">
          <div class="shimmer-line" style="width:88%"></div>
          <div class="shimmer-line" style="width:72%"></div>
          <div class="shimmer-line" style="width:81%"></div>
          <div class="shimmer-line" style="width:65%"></div>
          <div class="shimmer-line" style="width:78%"></div>
          <div class="shimmer-line" style="width:55%"></div>
        </div>
      </div>
    `);

    const output = await callClaude(skeleton, apiKey, currentGenre);
    currentOutput = output;

    document.getElementById('ai-placeholder')?.remove();

    // Append output cards
    outputArea.innerHTML += renderOutput(skeleton, output);
    await sleep(50);
    document.querySelectorAll('.card:not(.revealed)').forEach((c, i) => {
      setTimeout(() => c.classList.add('revealed'), i * 150);
    });

    // Mark all phases done
    ['phase-roll','phase-mbti','phase-skeleton','phase-ai'].forEach(p => {
      document.getElementById(p)?.classList.remove('active');
      document.getElementById(p)?.classList.add('done');
    });

    setStatus('Your fate is sealed. Edit and copy as needed.');

  } catch(err) {
    showError(`Generation failed: ${err.message}`);
    setStatus('');
    clearPhases();
  } finally {
    isGenerating = false;
    btn.disabled = false;
    btn.classList.remove('spinning');
  }
}

// ── Portrait generation ───────────────────────────────────────────────────
async function generatePortrait(btn) {
  const apiKey = document.getElementById('img-api-key').value.trim();
  if (!apiKey) {
    showError('Enter your Stability AI API key to generate portraits.');
    return;
  }
  const promptEl = document.getElementById('field-appearance');
  if (!promptEl || !promptEl.value.trim()) return;

  const wrapEl = document.getElementById('portrait-wrap');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-gear">⚙</span> Rendering…';
  wrapEl.innerHTML = `<div style="color:var(--brass-light);font-style:italic;font-size:0.9rem;margin-top:0.4rem;">Painting the portrait…</div>`;

  try {
    const form = new FormData();
    form.append('prompt', promptEl.value.trim());
    form.append('aspect_ratio', '2:3');
    form.append('output_format', 'png');

    const res = await fetch('https://api.stability.ai/v2beta/stable-image/generate/core', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${apiKey}`,
        'Accept': 'application/json',
      },
      body: form,
    });

    if (!res.ok) {
      const txt = await res.text().catch(() => '');
      throw new Error(`Stability API ${res.status}: ${txt}`);
    }

    const data = await res.json();
    const src = `data:image/png;base64,${data.image}`;
    const filename = `${(currentSkeleton?.name ?? 'portrait').replace(/\s+/g, '-')}.png`;

    wrapEl.innerHTML = `
      <img src="${src}" alt="Character portrait">
      <div class="portrait-actions">
        <a href="${src}" download="${filename}" class="btn-gen-portrait" style="text-decoration:none;">↓ Save</a>
        <button class="btn-gen-portrait" onclick="generatePortrait(this)">⚙ Regenerate</button>
      </div>`;
  } catch (err) {
    wrapEl.innerHTML = `<div class="portrait-error">Portrait failed: ${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '⚙ Generate Portrait';
  }
}

// ── Cookie helpers ────────────────────────────────────────────────────────
function setCookie(name, value, days) {
  const expires = new Date(Date.now() + days * 864e5).toUTCString();
  document.cookie = `${name}=${encodeURIComponent(value)};expires=${expires};path=/;SameSite=Strict`;
}

function getCookie(name) {
  const match = document.cookie.split('; ').find(r => r.startsWith(name + '='));
  return match ? decodeURIComponent(match.split('=')[1]) : '';
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('empty-state')?.style && (document.getElementById('output-area').style.minHeight = '200px');

  // Restore saved keys
  const antKey = getCookie('gof_anthropic_key');
  if (antKey) document.getElementById('api-key').value = antKey;
  const imgKey = getCookie('gof_stability_key');
  if (imgKey) document.getElementById('img-api-key').value = imgKey;

  // Persist keys as they change
  document.getElementById('api-key').addEventListener('input', e => setCookie('gof_anthropic_key', e.target.value, 365));
  document.getElementById('img-api-key').addEventListener('input', e => setCookie('gof_stability_key', e.target.value, 365));
});
