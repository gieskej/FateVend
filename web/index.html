<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gears of Fate — RPG Character Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<!-- Auto-generated by serve.sh from root .env — provides window.__ANTHROPIC_KEY etc. -->
<script src="generator/config.js" onerror="console.warn('config.js not found — enter keys manually')"></script>
</head>
<body>
<div class="page-wrap">

  <!-- HEADER -->
  <header class="site-header">
    <h1 class="site-title">Gears of Fate</h1>
    <p class="site-subtitle">RPG Character Generator for AI Dungeon</p>
  </header>

  <div class="divider">⚙ ⚙ ⚙</div>

  <!-- SETTINGS PANEL (collapses after first generation) -->
  <details id="settings-panel" open>
    <summary class="settings-summary">⚙ Settings</summary>

    <!-- API KEYS -->
    <div class="api-section">
      <label for="api-key">Anthropic API Key</label>
      <input id="api-key" class="api-input" type="password"
        placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
    </div>
    <div class="api-section">
      <label for="sd-url">Local SD URL <span style="font-style:italic;font-size:0.65rem;color:var(--ink-faint);text-transform:none;letter-spacing:0">(portraits — takes priority)</span></label>
      <input id="sd-url" class="api-input" type="text"
        placeholder="http://bonobo.local:7860" autocomplete="off" spellcheck="false">
    </div>
    <div class="api-section">
      <label for="img-api-key">Stability AI Key <span style="font-style:italic;font-size:0.65rem;color:var(--ink-faint);text-transform:none;letter-spacing:0">(portraits — fallback)</span></label>
      <input id="img-api-key" class="api-input" type="password"
        placeholder="sk-..." autocomplete="off" spellcheck="false">
    </div>
  </details>

  <!-- GENRE SELECTOR -->
  <div style="text-align:center;margin-bottom:1.25rem;">
    <div style="font-family:var(--font-display);font-size:0.62rem;letter-spacing:0.16em;color:var(--brass-light);text-transform:uppercase;margin-bottom:0.6rem;">Genre</div>
    <div style="display:inline-flex;gap:0;border:1px solid var(--brass-dark);border-radius:var(--radius);overflow:hidden;">
      <button id="genre-modern" onclick="setGenre('modern')"
        style="padding:0.5rem 1.5rem;font-family:var(--font-display);font-size:0.7rem;letter-spacing:0.12em;text-transform:uppercase;border:none;cursor:pointer;background:var(--brass);color:var(--ink);transition:background 0.15s,color 0.15s;">
        Modern
      </button>
      <button id="genre-fantasy" onclick="setGenre('fantasy')"
        style="padding:0.5rem 1.5rem;font-family:var(--font-display);font-size:0.7rem;letter-spacing:0.12em;text-transform:uppercase;border:none;cursor:pointer;background:rgba(26,18,8,0.6);color:var(--brass-light);transition:background 0.15s,color 0.15s;">
        Fantasy
      </button>
      <button id="genre-scifi" onclick="setGenre('sci-fi')"
        style="padding:0.5rem 1.5rem;font-family:var(--font-display);font-size:0.7rem;letter-spacing:0.12em;text-transform:uppercase;border:none;cursor:pointer;background:rgba(26,18,8,0.6);color:var(--brass-light);transition:background 0.15s,color 0.15s;">
        Sci-Fi
      </button>
    </div>
  </div>

  <!-- GENERATE BUTTON -->
  <div class="generate-wrap">
    <button id="btn-generate" class="btn-generate" onclick="runGenerate()">
      <span class="gear-icon">⚙</span>
      Turn the Gears
    </button>
  </div>

  <!-- STATUS -->
  <div id="status-bar" class="status-bar"></div>

  <!-- PHASE PIPELINE -->
  <div class="phase-pipeline" id="phase-pipeline">
    <div class="phase-step" id="phase-roll">
      <div class="phase-dot"></div>
      <span>Rolling Stats</span>
    </div>
    <div class="phase-step" id="phase-mbti">
      <div class="phase-dot"></div>
      <span>Personality</span>
    </div>
    <div class="phase-step" id="phase-skeleton">
      <div class="phase-dot"></div>
      <span>Fate</span>
    </div>
    <div class="phase-step" id="phase-ai">
      <div class="phase-dot"></div>
      <span>Narrative</span>
    </div>
  </div>

  <!-- ERROR -->
  <div id="error-box" class="error-box"></div>

  <!-- OUTPUT AREA -->
  <div id="output-area">
    <!-- Empty state shown before first generation -->
    <div id="empty-state" class="empty-state">
      <span class="empty-gear">⚙</span>
      <p>Your character awaits. Turn the gears.</p>
    </div>
  </div>

</div>

<script type="module">
import {
  // Modern
  GENDERS, ORIENTATIONS, ETHNICITIES, BUILDS, HAIR,
  DISTINGUISHING_FEATURES, QUIRKS,
  ECONOMIC_TIERS, CITY_SETTINGS, TAG_POOLS,
  PROFESSIONS, LIFE_EVENTS, TENSIONS, SECRETS, NAME_POOLS,
  PARENT_STATUSES, SIBLING_DYNAMICS, FAMILY_STRUCTURES,
  // Fantasy
  FANTASY_GENDERS, FANTASY_ORIENTATIONS, FANTASY_BUILDS, FANTASY_HAIR,
  FANTASY_RACES, FANTASY_DISTINGUISHING_FEATURES, FANTASY_QUIRKS,
  FANTASY_ECONOMIC_TIERS, FANTASY_CITY_SETTINGS, FANTASY_TAG_POOLS,
  FANTASY_PROFESSIONS, FANTASY_LIFE_EVENTS, FANTASY_TENSIONS, FANTASY_SECRETS,
  FANTASY_NAME_POOLS, FANTASY_PARENT_STATUSES, FANTASY_SIBLING_DYNAMICS, FANTASY_FAMILY_STRUCTURES,
  // Sci-fi
  SCIFI_GENDERS, SCIFI_ORIENTATIONS, SCIFI_BUILDS, SCIFI_HAIR,
  SCIFI_SPECIES, SCIFI_DISTINGUISHING_FEATURES, SCIFI_QUIRKS,
  SCIFI_ECONOMIC_TIERS, SCIFI_CITY_SETTINGS, SCIFI_TAG_POOLS,
  SCIFI_PROFESSIONS, SCIFI_LIFE_EVENTS, SCIFI_TENSIONS, SCIFI_SECRETS,
  SCIFI_NAME_POOLS, SCIFI_PARENT_STATUSES, SCIFI_SIBLING_DYNAMICS, SCIFI_FAMILY_STRUCTURES,
  // Shared
  STAT_ADJECTIVES, statAdjective,
  MBTI_TYPES,
  NPC_TRAITS, FRIEND_DYNAMICS, PARENT_DYNAMICS_ALIVE, FOIL_ROLES,
  NEUTRAL_FIRST_MASC, NEUTRAL_FIRST_FEM, NEUTRAL_LAST,
} from './generator/ui-data.js';

// ── Genre routing ─────────────────────────────────────────────────────────
function getGenreTables(genre) {
  if (genre === 'fantasy') {
    return {
      PROFESSIONS:           FANTASY_PROFESSIONS,
      LIFE_EVENTS:           FANTASY_LIFE_EVENTS,
      TENSIONS:              FANTASY_TENSIONS,
      SECRETS:               FANTASY_SECRETS,
      FAMILY_STRUCTURES:     FANTASY_FAMILY_STRUCTURES,
      PARENT_STATUSES:       FANTASY_PARENT_STATUSES,
      SIBLING_DYNAMICS:      FANTASY_SIBLING_DYNAMICS,
      ECONOMIC_TIERS:        FANTASY_ECONOMIC_TIERS,
      CITY_SETTINGS:         FANTASY_CITY_SETTINGS,
      TAG_POOLS:             FANTASY_TAG_POOLS,
      RACES_OR_ETHNICITIES:  FANTASY_RACES,
      GENDERS:               FANTASY_GENDERS,
      ORIENTATIONS:          FANTASY_ORIENTATIONS,
      BUILDS:                FANTASY_BUILDS,
      HAIR:                  FANTASY_HAIR,
      DISTINGUISHING_FEATURES: FANTASY_DISTINGUISHING_FEATURES,
      QUIRKS:                FANTASY_QUIRKS,
      NAME_POOLS:            FANTASY_NAME_POOLS,
    };
  }
  if (genre === 'sci-fi') {
    return {
      PROFESSIONS:             SCIFI_PROFESSIONS,
      LIFE_EVENTS:             SCIFI_LIFE_EVENTS,
      TENSIONS:                SCIFI_TENSIONS,
      SECRETS:                 SCIFI_SECRETS,
      FAMILY_STRUCTURES:       SCIFI_FAMILY_STRUCTURES,
      PARENT_STATUSES:         SCIFI_PARENT_STATUSES,
      SIBLING_DYNAMICS:        SCIFI_SIBLING_DYNAMICS,
      ECONOMIC_TIERS:          SCIFI_ECONOMIC_TIERS,
      CITY_SETTINGS:           SCIFI_CITY_SETTINGS,
      TAG_POOLS:               SCIFI_TAG_POOLS,
      RACES_OR_ETHNICITIES:    SCIFI_SPECIES,
      GENDERS:                 SCIFI_GENDERS,
      ORIENTATIONS:            SCIFI_ORIENTATIONS,
      BUILDS:                  SCIFI_BUILDS,
      HAIR:                    SCIFI_HAIR.map(h => ({ label: h })),
      DISTINGUISHING_FEATURES: SCIFI_DISTINGUISHING_FEATURES,
      QUIRKS:                  SCIFI_QUIRKS,
      NAME_POOLS:              SCIFI_NAME_POOLS,
    };
  }
  // Default: modern
  return {
    PROFESSIONS,
    LIFE_EVENTS,
    TENSIONS,
    SECRETS,
    FAMILY_STRUCTURES,
    PARENT_STATUSES,
    SIBLING_DYNAMICS,
    ECONOMIC_TIERS,
    CITY_SETTINGS,
    TAG_POOLS,
    RACES_OR_ETHNICITIES: ETHNICITIES,
    GENDERS,
    ORIENTATIONS,
    BUILDS,
    HAIR: HAIR.map(h => ({ label: h })),
    DISTINGUISHING_FEATURES,
    QUIRKS,
    NAME_POOLS,
  };
}

// ═══════════════════════════════════════════════════════════════════════════
// GENERATOR ENGINE — inlined (no imports)
// ═══════════════════════════════════════════════════════════════════════════

// ── Selectors ────────────────────────────────────────────────────────────
function uniformPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function uniformPickN(arr, n) { return [...arr].sort(() => Math.random() - 0.5).slice(0, Math.min(n, arr.length)); }
function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function weightedPick(arr) {
  const total = arr.reduce((s, i) => s + (i.weight ?? 1), 0);
  let r = Math.random() * total;
  for (const item of arr) { r -= (item.weight ?? 1); if (r <= 0) return item; }
  return arr[arr.length - 1];
}

function effectiveWeight(item, stats, base = 10) {
  const aff = item.statAffinity ?? {};
  let m = 1;
  for (const [stat, factor] of Object.entries(aff)) {
    if (stats[stat] !== undefined) m *= 1 + (factor - 1) * (stats[stat] / 100);
  }
  return Math.max(0.1, (item.weight ?? base) * m);
}

function statWeightedPick(arr, stats) {
  const w = arr.map(i => ({ item: i, weight: effectiveWeight(i, stats) }));
  const total = w.reduce((s, x) => s + x.weight, 0);
  let r = Math.random() * total;
  for (const { item, weight } of w) { r -= weight; if (r <= 0) return item; }
  return w[w.length - 1].item;
}

function statAndWeightPick(arr, stats) {
  const w = arr.map(i => ({ item: i, weight: effectiveWeight(i, stats, i.weight ?? 10) }));
  const total = w.reduce((s, x) => s + x.weight, 0);
  let r = Math.random() * total;
  for (const { item, weight } of w) { r -= weight; if (r <= 0) return item; }
  return w[w.length - 1].item;
}

// ── Stat rolling ─────────────────────────────────────────────────────────
function rollStat() {
  return Math.min(100, Math.max(1, Math.round((Math.random()*100+1 + Math.random()*100+1) / 2)));
}
function rollStats() {
  return { strength:rollStat(), intelligence:rollStat(), wisdom:rollStat(), charisma:rollStat(), dexterity:rollStat(), constitution:rollStat() };
}

// ── MBTI ─────────────────────────────────────────────────────────────────
function norm(v, min, max) { return Math.min(1, Math.max(0, (v - min) / (max - min))); }
function decide(p) { return Math.random() < p; }

function assignMBTI(s) {
  const isE = decide(norm((s.charisma + s.strength)/2 - (s.wisdom + s.intelligence)/2 + 50, 0, 100));
  const isN = decide(norm((s.intelligence + s.wisdom)/2 - (s.constitution + s.strength)/2 + 50, 0, 100));
  const isT = decide(norm((s.intelligence + s.wisdom)/2 - s.charisma + 50, 0, 100));
  const isJ = decide(norm((s.wisdom + s.constitution)/2 - (s.charisma + s.dexterity)/2 + 50, 0, 100));
  const typeStr = `${isE?'E':'I'}${isN?'N':'S'}${isT?'T':'F'}${isJ?'J':'P'}`;
  return MBTI_TYPES.find(m => m.type === typeStr) ?? MBTI_TYPES[0];
}

// ── Cast builder ─────────────────────────────────────────────────────────
const SIBLING_MAP = {
  protective_older:   n => `Stepped up for ${n} when no one else did — a habit they haven't broken`,
  rivalry:            n => `The competition with ${n} started in childhood and technically never stopped`,
  estranged:          n => `${n} and them haven't spoken in years. The reason is known. Unremarked upon.`,
  close_ally:         n => `The one person ${n} tells everything to, including the parts they shouldn't`,
  troubled:           n => `${n} is the "stable" one in this equation, which is its own kind of funny`,
  golden_child:       n => `The family benchmark — ${n} has spent years being measured against them without consent`,
  lost_touch:         n => `They were close once. Drifted. ${n} still occasionally drafts messages and doesn't send them`,
  deceased:           n => `Gone — and ${n} still sometimes forgets, for a moment, before remembering again`,
  younger_dependent:  n => `Looks to ${n} for stability ${n} is largely improvising`,
  reconnecting:       n => `Back in ${n}'s life after years away, both pretending it wasn't that long`,
};

function fillD(t, n) { return t.replace(/\{n\}/g, n); }
function pickTraits(n) { return uniformPickN(NPC_TRAITS, n); }

function buildCast(protName, protLast, ethnicityBroad, familyStructure, tables) {
  const namePools = tables.NAME_POOLS;
  const SIBLING_DYN = tables.SIBLING_DYNAMICS;
  const PARENT_STAT = tables.PARENT_STATUSES;
  const cast = [];
  const MAX = 7;
  const pc = familyStructure.parentCount ?? 0;

  function _parentName(isMother) {
    const pool = namePools[ethnicityBroad] ?? namePools['default'];
    const fn = isMother ? uniformPick(pool.fem) : uniformPick(pool.masc);
    return fn;
  }
  function _buildParent(role, structure) {
    let status;
    const id = structure.id;
    if (id === 'two_parent_one_deceased') {
      status = role === 'deceased' ? uniformPick(PARENT_STAT.filter(s => s.id.startsWith('deceased')))
             : uniformPick(PARENT_STAT.filter(s => !s.id.startsWith('deceased') && s.id !== 'absent_unknown'));
    } else if (id === 'two_parent_one_absent') {
      status = role === 'absent' ? uniformPick(PARENT_STAT.filter(s => s.id === 'absent_unknown' || s.id === 'estranged'))
             : uniformPick(PARENT_STAT.filter(s => !s.id.startsWith('deceased') && s.id !== 'absent_unknown'));
    } else if (['foster_care','orphaned_early','raised_by_grandparents','raised_by_older_sibling','temple_raised','guild_raised','war_orphan'].includes(id)) {
      status = uniformPick(PARENT_STAT.filter(s => s.id.startsWith('deceased') || s.id === 'absent_unknown' || s.id === 'estranged' || s.id === 'missing'));
    } else {
      status = uniformPick(PARENT_STAT);
    }
    const isDeceased = status.id.startsWith('deceased') || status.id === 'missing';
    const isAbsent   = status.id === 'absent_unknown';
    const isDivorced = id === 'two_parent_divorced';
    const isMother   = role === 'mother';
    const useDiffLast = isAbsent || (isDivorced && isMother && Math.random() < 0.5);
    const lastName = useDiffLast ? altLastName(protLast, ethnicityBroad, namePools) : protLast;
    const firstName = _parentName(isMother);
    const dynamic = isDeceased
      ? `${protName} still catches themselves thinking "I should call" before remembering`
      : fillD(uniformPick(PARENT_DYNAMICS_ALIVE), protName);
    return { name:`${firstName} ${lastName}`, role:isMother?'mother':'father', status:status.label, traits:pickTraits(2), dynamic };
  }

  if (pc === 2) {
    const isOneDeceased = familyStructure.id === 'two_parent_one_deceased';
    const isOneAbsent   = familyStructure.id === 'two_parent_one_absent';
    const mRole = isOneDeceased ? (Math.random()<0.5?'deceased':'surviving')
                : isOneAbsent   ? (Math.random()<0.5?'absent':'present') : 'present';
    const fRole = isOneDeceased ? (mRole==='deceased'?'surviving':'deceased')
                : isOneAbsent   ? (mRole==='absent'?'present':'absent') : 'present';
    cast.push(_buildParent('mother', {...familyStructure, _r:mRole}));
    cast.push(_buildParent('father', {...familyStructure, _r:fRole}));
  } else if (pc === 1) {
    const g = familyStructure.parentGender ?? (Math.random()<0.5?'mother':'father');
    cast.push(_buildParent(g, familyStructure));
  }

  const [minS, maxS] = familyStructure.siblingCount ?? [0,0];
  const sibSlots = Math.min(randomInt(minS, maxS), 2, MAX - cast.length - 2);
  for (let i = 0; i < sibSlots; i++) {
    const dyn = uniformPick(SIBLING_DYN);
    const genderId = Math.random() < 0.5 ? 'man' : 'woman';
    const pool = namePools[ethnicityBroad] ?? namePools['default'];
    const firstName = genderId === 'man' ? uniformPick(pool.masc) : uniformPick(pool.fem);
    const isOlder = ['protective_older','golden_child'].includes(dyn.id);
    const isYounger = dyn.id === 'younger_dependent';
    cast.push({
      name: `${firstName} ${protLast}`,
      role: isOlder ? 'older sibling' : isYounger ? 'younger sibling' : 'sibling',
      status: dyn.id === 'deceased' ? 'deceased' : dyn.label,
      traits: pickTraits(2),
      dynamic: (SIBLING_MAP[dyn.id] ?? (n => `Part of ${n}'s story in ways that are hard to untangle`))(protName),
    });
  }

  const friendSlots = Math.min(randomInt(1,2), MAX - cast.length - 1);
  for (let i = 0; i < friendSlots; i++) {
    cast.push({ name:neutralName(), role:'best friend', status:'present and close', traits:pickTraits(3), dynamic:fillD(uniformPick(FRIEND_DYNAMICS), protName) });
  }

  if (cast.length < MAX) {
    const foilType = uniformPick(FOIL_ROLES);
    cast.push({ name:neutralName(), role:foilType.role, status:'present', traits:pickTraits(2), dynamic:fillD(uniformPick(foilType.dynamics), protName) });
  }
  return cast;
}

// ── Name helpers ──────────────────────────────────────────────────────────
function poolFor(broad) { return NAME_POOLS[broad] ?? NAME_POOLS['default']; }

function pickFirst(genderId, pool) {
  if (['man','trans_man'].includes(genderId))     return uniformPick(pool.masc);
  if (['woman','trans_woman'].includes(genderId)) return uniformPick(pool.fem);
  const r = Math.random();
  return r < 0.4 ? uniformPick(pool.neutral) : r < 0.7 ? uniformPick(pool.masc) : uniformPick(pool.fem);
}

function protoName(genderId, pool) {
  const first = pickFirst(genderId, pool);
  const last  = uniformPick(pool.last);
  return { first, last, full: `${first} ${last}` };
}

function neutralName() {
  const first = Math.random() < 0.5 ? uniformPick(NEUTRAL_FIRST_MASC) : uniformPick(NEUTRAL_FIRST_FEM);
  return `${first} ${uniformPick(NEUTRAL_LAST)}`;
}

function familyFirst(genderId, ethnicityBroad) {
  return pickFirst(genderId, poolFor(ethnicityBroad));
}

function altLastName(currentLast, ethnicityBroad, namePools) {
  const opts = (namePools[ethnicityBroad] ?? namePools['default']).last.filter(n => n !== currentLast);
  return uniformPick(opts.length ? opts : (namePools[ethnicityBroad] ?? namePools['default']).last);
}

// ── Skeleton builder ──────────────────────────────────────────────────────
function buildSkeleton(stats, mbti, tables) {
  const { PROFESSIONS:P, LIFE_EVENTS:LE, TENSIONS:T, SECRETS:S, FAMILY_STRUCTURES:FS,
          ECONOMIC_TIERS:ET, CITY_SETTINGS:CS, TAG_POOLS:TP,
          RACES_OR_ETHNICITIES:ROE, GENDERS:G, ORIENTATIONS:O,
          BUILDS:B, HAIR:H, DISTINGUISHING_FEATURES:DF, QUIRKS:Q, NAME_POOLS:NP } = tables;

  const gender      = statAndWeightPick(G, stats);
  const orientation = weightedPick(O);
  const identity    = statAndWeightPick(ROE, stats);
  const namePool    = NP[identity.broad] ?? NP['default'];
  const nameResult  = protoName(gender.id, namePool);
  const name        = nameResult.full;
  const lastName    = nameResult.last;
  const ageRoll     = Math.random();
  const age         = ageRoll < 0.1 ? randomInt(19,24) : ageRoll < 0.75 ? randomInt(25,45) : ageRoll < 0.95 ? randomInt(46,58) : randomInt(59,70);
  const compatBuilds = B.filter(b => { const sa = b.statAffinity?.strength ?? 1.0; if (sa >= 1.4 && stats.strength < 55) return false; if (sa >= 1.2 && stats.strength < 35) return false; if (sa <= 0.75 && stats.strength > 65) return false; return true; });
  const build       = statWeightedPick(compatBuilds.length >= 2 ? compatBuilds : B, stats);
  const hairItem    = uniformPick(H);
  const hair        = typeof hairItem === 'string' ? hairItem : hairItem.label;
  const feat        = Math.random() < 0.25 ? null : uniformPick(DF.filter(f => f.label)).label;
  const quirk       = statWeightedPick(Q, stats);
  const profession  = statWeightedPick(P, stats);
  const sentiment   = uniformPick(profession.sentiments);
  const famStruct   = statWeightedPick(FS, stats);
  const lifeEvent   = statWeightedPick(LE, stats);
  let tier = profession.economicTier + (lifeEvent.economicHint ?? 0) + (famStruct.economicHint ?? 0);
  tier = Math.min(5, Math.max(1, Math.round(tier)));
  const econ = ET[tier];
  const econMarkers = [...econ.descriptors].sort(() => Math.random()-0.5).slice(0,2);
  const tension  = statWeightedPick(T, stats);
  const secret   = statWeightedPick(S, stats);
  const city     = statWeightedPick(CS, stats);
  const cast     = buildCast(name, lastName, identity.broad, famStruct, tables);

  // assemble tags
  const tags = new Set(TP.always);
  if (TP[city.toneTag]) TP[city.toneTag].forEach(t => tags.add(t));
  if (TP[tension.toneTag]) TP[tension.toneTag].forEach(t => tags.add(t));
  if (tension.criminalFlag && TP.criminal) TP.criminal.forEach(t => tags.add(t));
  (TP.professionTags?.[profession.industry] ?? []).forEach(t => tags.add(t));
  if (secret.severity === 'explosive' || secret.severity === 'high') { tags.add('secrets'); tags.add('betrayal'); }

  const PROF_SLUG_OVERRIDES = { 'Mid-level corporate suit': 'corporate_suit' };
  function profSlug(t) {
    if (PROF_SLUG_OVERRIDES[t]) return PROF_SLUG_OVERRIDES[t];
    return t.toLowerCase().replace(/\s*\/\s*/g,'_').replace(/[-\s]+/g,'_').replace(/[^a-z0-9_]/g,'');
  }

  return {
    name, age,
    gender: gender.label, pronouns: gender.pronouns,
    orientation: orientation.label,
    ethnicityBroad: identity.broad, ethnicityFlavor: identity.flavor,
    appearance: { build: build.label, hair, distinguishingFeature: feat, statNotes: appearanceStatNotes(stats) },
    quirk: quirk.quirk,
    stats, mbti: mbti.type, mbtiLabel: mbti.label,
    profession: profession.title, industry: profession.industry,
    economicTier: tier, economicLabel: econ.label,
    economicMarkers: econMarkers,

const SYSTEM_PROMPT = `You are a creative writer generating AI Dungeon scenario content.

Output only the JSON structure requested. No preamble, no commentary, no markdown fences.`;

function buildPrompt(sk, genre) {
  const castLines = sk.cast.map(npc =>
    `  - ${npc.name} (${npc.role}, ${npc.status}): ${npc.traits.join(', ')}. ${npc.dynamic}`

  const appParts = [sk.appearance.build, sk.appearance.hair, sk.appearance.distinguishingFeature, ...(sk.appearance.statNotes ?? [])].filter(Boolean).join('; ');
  const identityLabel  = genre === 'fantasy' ? 'Race' : genre === 'sci-fi' ? 'Species' : 'Ethnicity';
  const genreLabel     = genre === 'fantasy' ? 'fantasy' : genre === 'sci-fi' ? 'AI Dungeon sci-fi' : 'AI Dungeon';
  const entryNote      = genre === 'fantasy'
    ? 'Lead with name, rough age, role. Weave in race appearance and quirk through behavior. Ground in sensory fantasy detail. End on forward momentum.'
    : genre === 'sci-fi'
    ? 'Lead with name, age, role. Weave in species and augmentation level through behavior — show don\'t state. Ground in sensory sci-fi detail. Use sentence fragments. Reference key cast members. End on forward momentum.'
    : 'Lead with name, age, role. Use sentence fragments. Fold in appearance and quirk through behavior. Reference key cast members. End on forward momentum.';
  const openingNote    = genre === 'fantasy'
    ? 'Second person. Drop the player into a vivid fantasy moment right now — mid-scene. Sensory detail (smells, sounds, weight of gear). End mid-moment with a clear choice.'
    : genre === 'sci-fi'
    ? 'Second person. Drop the player into a specific vivid sci-fi moment — right now, mid-scene. Smells: recycled air, ozone, synth-food. Weight: aug hardware, vacuum suit. End mid-moment with a clear choice or action available. No backstory. No summaries.'
    : 'Second person. Drop the player directly into a vivid, specific moment — right now. Sensory detail. End mid-moment with a clear next decision.';
  const appearanceNote = genre === 'fantasy'
    ? 'Comma-separated visual descriptors for a text-to-image model. Start with "portrait of" then: race, age range, gender, body type, hair color and style, eye description, distinguishing feature if any, armor or clothing suited to their role, setting mood. Include "face of [a historical figure, classical warrior, or well-known portrait subject whose gender, racial appearance, and approximate age match this character]". Close with: fantasy character art, detailed digital illustration, dramatic lighting. No sentences — descriptors only.'
    : genre === 'sci-fi'
    ? 'Comma-separated visual descriptors for a text-to-image model. Start with "portrait of" then: species and augmentation description, age range, gender, body type, hair, eyes, cybernetic features if any, clothing and equipment suited to their role and economic tier, setting mood. Include "face of [a historical figure or well-known portrait subject whose gender and appearance match this character — someone whose likeness is well-documented]". Close with: sci-fi concept art, detailed digital illustration, dramatic lighting. No sentences — descriptors only.'
    : 'Comma-separated visual descriptors for a text-to-image model. Start with "portrait of" then: age range, gender, body type, hair color and style, eye description, distinguishing feature if any, outfit suited to their job and economic tier, setting mood. Include "face of [a historical figure or classic-cinema figure whose gender, ethnicity, and approximate age match this character — someone whose likeness is well-documented in photographs or portraiture]". Close with: photorealistic, cinematic lighting. No sentences — descriptors only.';

  return `Generate ${genreLabel} content for this character. Return a single JSON object with these exact keys:
"characterEntry", "npcEntries", "title", "description", "tags", "opening", "appearancePrompt"

CHARACTER SKELETON:
Name: ${sk.name}, ${sk.age}, ${sk.gender} (${sk.pronouns})
${identityLabel}: ${sk.ethnicityFlavor}
Orientation: ${sk.orientation}
Appearance: ${appParts}
Quirk: ${sk.quirk}
Profession: ${sk.profession} (${sk.industry}) — feels ${sk.sentiment} about it
Stats: STR ${sk.stats.strength} | INT ${sk.stats.intelligence} | WIS ${sk.stats.wisdom} | CHA ${sk.stats.charisma} | DEX ${sk.stats.dexterity} | CON ${sk.stats.constitution}
Personality: ${sk.mbti} — ${sk.mbtiLabel}
Economic status: ${sk.economicLabel} — ${(sk.econMarkers || sk.economicMarkers).join('; ')}
Housing: ${sk.housing} | Transport: ${sk.transport}
Setting: ${sk.cityLabel} — ${sk.cityFlavor}
Formative event: ${sk.lifeEvent}
Current tension: ${sk.tension}
Secret (severity: ${sk.secretSeverity}): ${sk.secret}

SUPPORTING CAST:
${castLines}

OUTPUT RULES:

"characterEntry": MAX 1000 chars. Terse behavioral prose. ${entryNote} Make the reader want to be this person, at least for an evening. Specific, alive, a little fun.

"npcEntries": Object keyed by NPC name. Each value MAX 1000 chars. Same style. Reference protagonist by name. These people should feel worth knowing.

"title": MAX 70 chars. Hook the player. Specific, evocative. Can be darkly funny if it fits.

"description": MAX 5000 chars. Second person ("You are..."). Set the scene: who the player is, what their world feels like, what's at stake. Weave in 2–3 cast members. Hint at the tension and secret without stating them plainly. End with something that makes the player want to begin.

"tags": Array of 8–10 lowercase strings. Genre-appropriate.

"opening": MAX 4000 chars. ${openingNote}

"appearancePrompt": MAX 500 chars. ${appearanceNote}`;
}

function parseResponse(raw) {
  try {
    const clean = raw.replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/```\s*$/i,'').trim();
    const p = JSON.parse(clean);
    return { characterEntry: p.characterEntry??'', npcEntries: p.npcEntries??{}, title: p.title??'', description: p.description??'', tags: p.tags??[], opening: p.opening??'', appearancePrompt: p.appearancePrompt??'' };
  } catch(e) { return null; }
}

async function callClaude(skeleton, apiKey, genre) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 4096,
      system: getSystemPrompt(genre),
      messages: [{ role: 'user', content: buildPrompt(skeleton, genre) }],
    }),
  });
  if (!res.ok) { const t = await res.text().catch(()=>''); throw new Error(`API error ${res.status}: ${t}`); }
  const data = await res.json();
  const raw = data.content?.filter(b=>b.type==='text').map(b=>b.text).join('') ?? '';
  if (!raw) throw new Error('Empty response from API');
  const parsed = parseResponse(raw);
  if (!parsed) throw new Error('Failed to parse API response as JSON');
  return parsed;
}

// ── Copy to clipboard ─────────────────────────────────────────────────────
// Uses Clipboard API where available, falls back to execCommand for
// environments that block navigator.clipboard (iframes, non-HTTPS, etc.)
function copyToClipboard(text) {
  // Modern API first
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true).catch(() => {
      return execCommandCopy(text);
    });
  }
  return Promise.resolve(execCommandCopy(text));
}

function execCommandCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e) {
    return false;
  }
}

async function copyText(text, btn) {
  const originalHTML = btn.innerHTML;
  const ok = await copyToClipboard(text);
  if (ok) {
    btn.innerHTML = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = originalHTML; btn.classList.remove('copied'); }, 1800);
  } else {
    btn.innerHTML = '✗ Failed';
    setTimeout(() => { btn.innerHTML = originalHTML; }, 1800);
  }
}

// ── Char counter ──────────────────────────────────────────────────────────
function attachCounter(textarea, limit, counterId) {
  const counter = document.getElementById(counterId);
  if (!counter || !textarea) return;
  const update = () => {
    const len = textarea.value.length;
    const remaining = limit - len;
    counter.textContent = `${len} / ${limit}`;
    counter.classList.toggle('over', remaining < 0);
  };
  textarea.addEventListener('input', update);
  update();
}

async function animateSlots(skeleton, genre) {
  const cfg  = getSlotConfig(genre);
  const slots = skeleton._slots;
  if (!slots) return;

  const intervals = {};
  const indices   = {};

  cfg.defs.forEach(def => {
    const entries = cfg.catalog[def.cat] ?? [];
    if (!entries.length) return;
    indices[def.key] = Math.floor(Math.random() * entries.length);

    const img  = document.getElementById(`slot-img-${def.key}`);
    if (!img) return;

    const base = def.common ? COMMON_ICON_BASE : cfg.iconBase;
    const showFrame = () => {
      const [, iconSlug] = entries[indices[def.key]];
      img.src = iconPath(base, def.cat, iconSlug);
    };
    showFrame();

    intervals[def.key] = setInterval(() => {
      indices[def.key] = (indices[def.key] + 1) % entries.length;
      showFrame();
    }, 90);
  });

  // Land each slot with a stagger
  for (let i = 0; i < cfg.defs.length; i++) {
    await sleep(i === 0 ? 600 : 150);

    const def      = cfg.defs[i];
    clearInterval(intervals[def.key]);

    const entries  = cfg.catalog[def.cat] ?? [];
    const dataSlug = slots[def.key];
    const entry    = entries.find(e => e[0] === dataSlug);

    const img    = document.getElementById(`slot-img-${def.key}`);
    const lblEl  = document.getElementById(`slot-lbl-${def.key}`);
    const slotEl = document.getElementById(`slot-${def.key}`);

    const base = def.common ? COMMON_ICON_BASE : cfg.iconBase;
    if (entry) {
      const [, iconSlug, label] = entry;
      if (img) img.src = iconPath(base, def.cat, iconSlug);
      if (lblEl) lblEl.textContent = label;
    } else {
      if (img) img.closest('.slot-window').innerHTML = '<div class="slot-placeholder">⚙</div>';
      if (lblEl) lblEl.textContent = (dataSlug ?? '').replace(/_/g,' ');
    }

    if (slotEl) { slotEl.classList.remove('rolling'); slotEl.classList.add('landed'); }

    if (i === 0) {
      _bellSfx.currentTime = 0;
      _bellSfx.play().catch(() => {});
    }
  }
}

  const t = v => Math.min(4, Math.floor((v - 1) / 20));

    CHA_APPEARANCE_NOTES[t(stats.charisma)],

}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function updateCount(el, counterId, limit) {
  const counter = document.getElementById(counterId);
  if (!counter) return;
  counter.textContent = `${el.value.length} / ${limit}`;
  counter.classList.toggle('over', el.value.length > limit);

async function copyField(id, btn) {

async function copyTags(btn) {

async function copyAll(btn) {

  const annotatedStats = Object.fromEntries(

async function runGenerate() {
  if (isGenerating) return;
  const apiKey = document.getElementById('api-key').value.trim();
  if (!apiKey) {
    showError('Please enter your Anthropic API key to generate narrative content. (You can find it at console.anthropic.com)');
    return;
  }

  isGenerating = true;
  currentOutput = null;
  showError('');
  document.getElementById('settings-panel').open = false;
  const btn = document.getElementById('btn-generate');
  btn.disabled = true;
  btn.classList.add('spinning');

  // Clear old output and any lingering continue bar
  document.getElementById('output-area').innerHTML = '';

  try {
    // Phase 1 — Roll stats
    setPhase('phase-roll');
    setStatus('The gears begin to turn…');
    await sleep(300);
    const stats = rollStats();

    // Phase 2 — MBTI
    setPhase('phase-mbti');
    setStatus('Consulting the personality oracle…');
    await sleep(250);
    const mbti = assignMBTI(stats);

    // Phase 3 — Skeleton
    setPhase('phase-skeleton');
    setStatus('Weaving the threads of fate…');
    await sleep(300);
    const tables = getGenreTables(currentGenre);
    const skeleton = buildSkeleton(stats, mbti, tables);
    currentSkeleton = skeleton;

    const outputArea = document.getElementById('output-area');

    // ── Slot machine phase ─────────────────────────────────────────────
    setStatus('The fates are deciding…');
    outputArea.innerHTML = renderSlotMachine(currentGenre);
    await animateSlots(skeleton, currentGenre);   // ~2s staggered animation
    await sleep(200);

    // Skeleton cards appear below the (now locked) slot machine
    outputArea.insertAdjacentHTML('beforeend', renderSkeleton(skeleton));

    await sleep(50);
    document.querySelectorAll('.card').forEach((c, i) => {
      setTimeout(() => c.classList.add('revealed'), i * 120);
    });

    // Pause — show Continue bar instead of immediately calling Claude
    outputArea.insertAdjacentHTML('beforeend', `
      <div id="continue-bar" class="continue-bar">
        <div class="continue-bar-label">Like this character? Generate the full scenario.</div>
        <button id="btn-continue" class="btn-continue" onclick="runAIPhase()">
          <span class="gear-icon">⚙</span> Generate Scenario
        </button>
      </div>
    `);

    // Mark phases 1-3 done, leave phase-ai idle
    ['phase-roll','phase-mbti','phase-skeleton'].forEach(p => {
      document.getElementById(p)?.classList.remove('active');
      document.getElementById(p)?.classList.add('done');
    });
    setStatus('Review the character sheet, then generate the scenario when ready.');

  } catch(err) {
    showError(`Generation failed: ${err.message}`);
    setStatus('');
    clearPhases();
  } finally {
    isGenerating = false;
    btn.disabled = false;
    btn.classList.remove('spinning');
  }
}

async function runAIPhase() {
  if (isGenerating || !currentSkeleton) return;
  const apiKey = document.getElementById('api-key').value.trim();
  if (!apiKey) {
    showError('Please enter your Anthropic API key.');
    return;
  }

  isGenerating = true;
  showError('');

  const continueBtn = document.getElementById('btn-continue');
  const generateBtn = document.getElementById('btn-generate');
  if (continueBtn) { continueBtn.disabled = true; continueBtn.classList.add('spinning'); }
  generateBtn.disabled = true;

  const outputArea = document.getElementById('output-area');

  try {
    // Remove Continue bar and insert shimmer placeholder
    document.getElementById('continue-bar')?.remove();

    setPhase('phase-ai');
    setStatus('Summoning the narrative…');

    outputArea.insertAdjacentHTML('beforeend', `
      <div id="ai-placeholder" class="card ai-loading-placeholder revealed">
        <div class="card-header">
          <span class="card-title"><span class="loading-gear">⚙</span> Generating Scenario…</span>
        </div>
        <div class="card-body" style="padding:1.25rem 1.5rem;">
          <div class="shimmer-line" style="width:88%"></div>
          <div class="shimmer-line" style="width:72%"></div>
          <div class="shimmer-line" style="width:81%"></div>
          <div class="shimmer-line" style="width:65%"></div>
          <div class="shimmer-line" style="width:78%"></div>
          <div class="shimmer-line" style="width:55%"></div>
        </div>
      </div>
    `);

    const output = await callClaude(currentSkeleton, apiKey, currentGenre);

    document.getElementById('ai-placeholder')?.remove();

    await sleep(50);
    document.querySelectorAll('.card:not(.revealed)').forEach((c, i) => {
      setTimeout(() => c.classList.add('revealed'), i * 150);

    ['phase-roll','phase-mbti','phase-skeleton','phase-ai'].forEach(p => {
      document.getElementById(p)?.classList.remove('active');
      document.getElementById(p)?.classList.add('done');
    });

    setStatus('Your fate is sealed. Edit and copy as needed.');

    if (output.appearancePrompt && (document.getElementById('sd-url').value.trim() || document.getElementById('img-api-key').value.trim())) {
      generatePortrait(null);

  } catch(err) {

    // Restore continue bar so they can try again
    outputArea.insertAdjacentHTML('beforeend', `
      <div id="continue-bar" class="continue-bar">
        <div class="continue-bar-label">Generation failed — try again?</div>
        <button id="btn-continue" class="btn-continue" onclick="runAIPhase()">
          <span class="gear-icon">⚙</span> Generate Scenario
        </button>
      </div>
    `);
  } finally {
    isGenerating = false;
    generateBtn.disabled = false;
    generateBtn.classList.remove('spinning');
  }
}

// ── Portrait generation ───────────────────────────────────────────────────
async function generatePortrait(btn) {
  const sdUrl    = document.getElementById('sd-url').value.trim();
  const apiKey   = document.getElementById('img-api-key').value.trim();
  if (!sdUrl && !apiKey) {
    showError('Enter a local SD URL or Stability AI key to generate portraits.');
    return;
  }
  const promptEl = document.getElementById('field-appearance');
  if (!promptEl || !promptEl.value.trim()) return;

  const wrapEl = document.getElementById('portrait-wrap');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="loading-gear">⚙</span> Rendering…'; }
  wrapEl.innerHTML = `<div style="color:var(--brass-light);font-style:italic;font-size:0.9rem;margin-top:0.4rem;">Painting the portrait…</div>`;

  try {
    let src;
    if (sdUrl) {
      // ── Local Stable Diffusion WebUI (Forge / A1111) with Flux1-dev model ──────────────────
      const res = await fetch(`${sdUrl}/sdapi/v1/txt2img`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt:           promptEl.value.trim(),
          negative_prompt:  'low quality, blurry, duplicate, deformed, bad anatomy, extra limbs, text, watermark, logo',
          steps:            30,
          width:            512,
          height:           768,
          cfg_scale:        1,
          distilled_cfg_scale: 6,
          sampler_name:     'Euler',
          scheduler:        'Simple',
        }),
      });
      if (!res.ok) { const t = await res.text().catch(()=>''); throw new Error(`SD API ${res.status}: ${t}`); }
      const data = await res.json();
      src = `data:image/png;base64,${data.images[0]}`;
    } else {
      // ── Stability AI fallback ─────────────────────────────────────────
      const form = new FormData();
      form.append('prompt', promptEl.value.trim());
      form.append('aspect_ratio', '2:3');
      form.append('output_format', 'png');
      const res = await fetch('https://api.stability.ai/v2beta/stable-image/generate/core', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${apiKey}`, 'Accept': 'application/json' },
        body: form,
      });
      if (!res.ok) { const t = await res.text().catch(()=>''); throw new Error(`Stability API ${res.status}: ${t}`); }
      const data = await res.json();
      src = `data:image/png;base64,${data.image}`;
    }

    const filename = `${(currentSkeleton?.name ?? 'portrait').replace(/\s+/g, '-')}.png`;
    wrapEl.innerHTML = `
      <img src="${src}" alt="Character portrait">
      <div class="portrait-actions">
        <a href="${src}" download="${filename}" class="btn-gen-portrait" style="text-decoration:none;">↓ Save</a>
        <button class="btn-gen-portrait" onclick="generatePortrait(this)">⚙ Regenerate</button>
      </div>`;
  } catch (err) {
    wrapEl.innerHTML = `<div class="portrait-error">Portrait failed: ${err.message}</div>`;
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '⚙ Generate Portrait'; }
  }
}

document.addEventListener('DOMContentLoaded', () => {
  // Seed fields from serve.sh-generated config.js (takes priority — always
  // reflects the current .env key), then fall back to localStorage.
  const CONFIG_MAP = {
    'api-key':     window.__ANTHROPIC_KEY,
    'sd-url':      window.__SD_URL,
    'img-api-key': window.__STABILITY_KEY,
  };
  KEY_FIELDS.forEach(({ id, store }) => {
    const fromConfig = CONFIG_MAP[id];
    const fromStore  = localStorage.getItem(store);
    const value = fromConfig || fromStore || '';
    if (value) {
      document.getElementById(id).value = value;
      localStorage.setItem(store, value);
    }
  });

  // Save on every change
  KEY_FIELDS.forEach(({ id, store }) => {
    document.getElementById(id).addEventListener('input', e => {
      const v = e.target.value.trim();
      if (v) localStorage.setItem(store, v);
      else   localStorage.removeItem(store);
    });
  });
});

// Expose module functions to inline HTML event handlers
Object.assign(window, {
  runGenerate, runAIPhase, setGenre,
  copyField, copyAll, copySkeletonText, copyTags,
  generatePortrait, updateCount,
});
</script>
</body>
</html>
